name: Test Notify Gallery

# 临时验证工作流：确认 secrets.REPO_TOKEN 是否具备 wallpaper-gallery 的写权限
# （repository_dispatch 需要写权限，否则 GitHub 返回 404）。
# 验证通过后本文件会被删除。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run notify-gallery
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          SOURCE: manual-permission-test
          NEW_TAG: v1.5.11
          REPO_NAME: nuanXinProPic
          SHARD_LABEL: 主仓
        run: bash scripts/notify-gallery.sh
